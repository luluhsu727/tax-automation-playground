[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-automation-playground"
version = "0.1.0"
description = "VAT payable calculator by jurisdiction"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
